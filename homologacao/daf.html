<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniGestor — DAF</title><style>*{box-sizing:border-box}body{margin:0;font:16px Arial;color:#102e55;background:#f5f7fa}.layout{height:100vh;display:grid;grid-template-columns:30% 70%;grid-template-rows:85px 1fr}.head{grid-column:1/-1;background:#08628f;color:white;padding:15px 25px;display:flex;justify-content:space-between;align-items:center}.head b{font-size:38px}.head span{font-size:30px;font-weight:bold}.brand{background:linear-gradient(155deg,#08628f,#075079);color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:30px}.brand img{width:100%;max-height:230px;object-fit:contain}.main{display:flex;flex-direction:column;min-width:0}.scan{background:#f3f4f6;padding:18px;text-align:center}.scan input{width:100%;border:0;background:transparent;color:#8d1820;text-align:center;font-size:30px;font-weight:900;padding:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats small{display:block;font-size:12px;color:#555}.stats b{font-size:24px}.items{flex:1;overflow:auto;background:white}table{width:100%;border-collapse:collapse}th,td{padding:13px;text-align:left;border-bottom:1px solid #ddd}th{background:#e8eef5}.client{padding:15px;background:#e6eaf0}.client input{font-size:19px;padding:10px;width:75%}.foot{padding:18px;background:#f1f2f5;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.foot strong{margin-left:auto;font-size:36px}button{border:0;border-radius:6px;padding:12px 16px;background:#174c89;color:white;font-weight:bold;cursor:pointer}.save{background:#16804b}.modal{position:fixed;inset:0;background:#000a;display:flex;justify-content:center;align-items:center}.modal[hidden]{display:none}.dialog{width:min(600px,95vw);background:white;padding:25px;border-radius:10px}.dialog input{width:100%;padding:12px;font-size:20px}.results{max-height:50vh;overflow:auto}@media(max-width:750px){.layout{grid-template-columns:1fr}.brand{display:none}.head b{font-size:22px}.head span{font-size:19px}}</style></head><body><div class="layout"><header class="head"><b>UniGestor</b><span>DAF — PRÉ-VENDA</span><small>SEM PAGAMENTO</small></header><aside class="brand"><img src="./logo-unigestor.png" alt="UniGestor"><h2>DAF</h2><p>Pré-venda interna</p></aside><main class="main"><div class="scan"><input id="codigo" placeholder="DIGITE OU LEIA O CÓDIGO DE BARRAS" autocomplete="off"><div class="stats"><div><small>QUANTIDADE</small><b id="qtd">—</b></div><div><small>PREÇO UNITÁRIO</small><b id="unit">—</b></div><div><small>PREÇO TOTAL</small><b id="subtotal">—</b></div></div></div><div class="items"><table><thead><tr><th>PRODUTO</th><th>QTD</th><th>UNITÁRIO</th><th>TOTAL</th><th></th></tr></thead><tbody id="linhas"></tbody></table></div><div class="client"><label>CLIENTE: <input id="cliente" maxlength="120" placeholder="Nome do cliente"></label></div><footer class="foot"><button id="buscar">F2 — Buscar produto</button><button id="limpar">Limpar</button><button class="save" id="salvar">F9 — SALVAR DAF</button><strong id="total">R$ 0,00</strong></footer></main></div><div class="modal" id="modal" hidden><div class="dialog"><h2>Buscar produto</h2><input id="filtro" placeholder="Nome ou código"><div class="results" id="resultados"></div><button id="fechar">Fechar</button></div></div><script>
(()=>{const $=id=>document.getElementById(id),money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let cart=[],busy=false;const products=()=>{try{return JSON.parse(localStorage.getItem('cb_hom_estoque')||'[]')}catch(e){return []}};const total=()=>cart.reduce((a,x)=>a+x.qtd*x.preco,0);
function render(){let last=cart[cart.length-1];$('qtd').textContent=last?.qtd??'—';$('unit').textContent=last?money(last.preco):'—';$('subtotal').textContent=last?money(last.preco*last.qtd):'—';$('total').textContent=money(total());$('linhas').replaceChildren();for(let i=0;i<cart.length;i++){const x=cart[i],tr=document.createElement('tr');for(const v of [x.nome,x.qtd,money(x.preco),money(x.qtd*x.preco)]){const td=document.createElement('td');td.textContent=v;tr.appendChild(td)}const td=document.createElement('td'),btn=document.createElement('button');btn.textContent='×';btn.onclick=()=>{cart.splice(i,1);render()};td.appendChild(btn);tr.appendChild(td);$('linhas').appendChild(tr)}}
function add(p,q){if(!Number.isFinite(q)||q<=0)return alert('Quantidade inválida');const x=cart.find(y=>y.nome===p.nome);if(x)x.qtd=Math.round((x.qtd+q)*1000)/1000;else cart.push({nome:p.nome,qtd:q,preco:Number(p.preco)||0});render();$('codigo').focus()}
$('codigo').onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();const raw=$('codigo').value.trim();$('codigo').value='';const m=raw.match(/^(\d+(?:[.,]\d+)?)\s*\*\s*(.+)$/),q=m?Number(m[1].replace(',','.')):1,c=m?m[2].trim():raw;const p=products().find(x=>String(x.barras||'')===c||String(x.codigo||'')===c);if(!p)return alert('Produto não encontrado: '+c);add(p,q)};
function draw(){const q=$('filtro').value.toLocaleLowerCase('pt-BR');$('resultados').replaceChildren();for(const p of products().filter(x=>(x.nome+' '+(x.codigo||'')+' '+(x.barras||'')).toLocaleLowerCase('pt-BR').includes(q)).slice(0,70)){const b=document.createElement('button');b.style.cssText='display:block;width:100%;margin:5px 0;text-align:left';b.textContent=p.nome+' — '+money(p.preco);b.onclick=()=>{add(p,1);close()};$('resultados').appendChild(b)}}
function open(){$('modal').hidden=false;$('filtro').value='';draw();$('filtro').focus()}function close(){$('modal').hidden=true;$('codigo').focus()}$('buscar').onclick=open;$('fechar').onclick=close;$('filtro').oninput=draw;$('limpar').onclick=()=>{if(cart.length&&confirm('Limpar DAF?')){cart=[];render()}};
async function save(){if(busy)return;const cliente=$('cliente').value.trim();if(!cliente)return alert('Informe o nome do cliente');if(!cart.length)return alert('Adicione produtos');busy=true;$('salvar').disabled=true;try{const r=await fetch('./licenca/api.php?action=daf_create',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({cliente,itens:cart})}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.erro||'Erro ao salvar');cart=[];$('cliente').value='';render();alert('DAF '+d.daf.numero+' salvo. Aguardando caixa.')}catch(e){alert('DAF não salvo: '+e.message)}finally{busy=false;$('salvar').disabled=false;$('codigo').focus()}}
$('salvar').onclick=save;document.addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();open()}else if(e.key==='F9'){e.preventDefault();save()}else if(e.key==='Escape'&&!$('modal').hidden){e.preventDefault();close()}});render();$('codigo').focus()})();
</script></body></html>
